name: keepalive
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping
        run: |
          fail=0
          for f in clients/*.js; do
            name=$(basename "$f" .js)
            case "$name" in _*) continue;; esac
            url=$(grep -oE "SUPABASE_URL:[[:space:]]*'[^']+'" "$f" | sed -E "s/.*'([^']+)'/\1/")
            key=$(grep -oE "SUPABASE_KEY:[[:space:]]*'[^']+'" "$f" | sed -E "s/.*'([^']+)'/\1/")
            if [ -z "$url" ] || [ -z "$key" ]; then echo "missing: $name"; continue; fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $key" "$url/rest/v1/license_settings?select=id&limit=1")
            if [ "$code" = "200" ]; then echo "OK $name ($code)"; else echo "FAIL $name ($code)"; fail=1; fi
          done
          exit $fail
